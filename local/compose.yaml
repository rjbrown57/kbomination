name: kbomination-local

services:
  kbomination:
    image: ghcr.io/rjbrown57/kbomination:latest
    pull_policy: always
    init: true
    command: ["serve", "--listen", "0.0.0.0:8080", "--allow-non-loopback", "--db", "/data/kbomination.duckdb"]
    expose:
      - "8080"
    environment:
      KUBECONFIG: /kube/config
    volumes:
      - type: bind
        source: ${KBOMINATION_KUBE_DIR:-${HOME}/.kube}
        target: /kube
        read_only: true
        bind:
          create_host_path: false
      - kbomination-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    depends_on:
      kbomination:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KBOMINATION_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    restart: unless-stopped

volumes:
  kbomination-data:
