[tools]
go = "1.26.8"
node = "24.8.0"
trivy = "0.76.0"
kind = "0.30.0"
kubectl = "1.34.1"
helm = "3.17.3"
goreleaser = "2.18.3"

[tasks.setup]
run = ["go mod download", "npm --prefix web ci"]

[tasks.dev]
run = "go run ./cmd/kbomination serve"

[tasks."dev:web"]
run = "npm --prefix web run dev"

[tasks."build:web"]
run = "npm --prefix web run build"

[tasks.build]
run = "KBOMINATION_LOCAL_BUILD=1 goreleaser build --snapshot --single-target --clean --id kbomination-local --output bin/kbomination"

[tasks."release:snapshot"]
description = "Build the current platform release binary without publishing"
run = "KBOMINATION_LOCAL_BUILD=1 goreleaser build --snapshot --single-target --clean --id kbomination-local --output bin/kbomination"

[tasks.release]
description = "Publish release binaries and Docker images for the current tag"
run = "goreleaser release --clean"

[tasks.test]
run = ["go test ./...", "npm --prefix web run check"]

[tasks.collect]
run = "go run ./cmd/kbomination collect"

[tasks.e2e]
run = "bash scripts/e2e.sh"

[tasks.testenv]
run = "bash scripts/testenv.sh"

[tasks."sample-db"]
description = "Create a local sample database from checked-in KBOM fixtures"
run = "bash scripts/sample-db.sh"

[tasks."compose:build"]
description = "Build the local Docker image"
run = "docker compose build"

[tasks."compose:up"]
description = "Build and start the local service, waiting until healthy"
run = "docker compose up --build -d --wait"

[tasks."compose:down"]
description = "Stop the local service and retain its database volume"
run = "docker compose down"

[tasks."compose:logs"]
description = "Follow the local service logs"
run = "docker compose logs -f"

[tasks."compose:ps"]
description = "Show local service status"
run = "docker compose ps"

[tasks."compose:contexts"]
description = "List kubeconfig contexts from the running container"
run = "docker compose exec kbomination kbomination contexts"

[tasks."helm:lint"]
description = "Lint the Kubernetes deployment chart"
run = "helm lint chart/kbomination"

[tasks."helm:template"]
description = "Render the Kubernetes deployment chart"
run = "helm template kbomination chart/kbomination"
