[tools]
go = "1.26.8"
node = "24.8.0"
trivy = "0.76.0"
kind = "0.30.0"
kubectl = "1.34.1"
helm = "3.17.3"
goreleaser = "2.18.3"

[tasks.setup]
run = ["go mod download", "npm --prefix web ci"]

[tasks.dev]
run = "go run ./cmd/kbomination serve"

[tasks."dev:web"]
run = "npm --prefix web run dev"

[tasks."build:web"]
run = "npm --prefix web run build"

[tasks.build]
run = "KBOMINATION_LOCAL_BUILD=1 goreleaser build --snapshot --single-target --clean --id kbomination-local --output bin/kbomination"

[tasks."release:snapshot"]
description = "Build the current platform release binary without publishing"
run = "KBOMINATION_LOCAL_BUILD=1 goreleaser build --snapshot --single-target --clean --id kbomination-local --output bin/kbomination"

[tasks.release]
description = "Publish release binaries and Docker images for the current tag"
run = "goreleaser release --clean"

[tasks.test]
run = ["go test ./...", "npm --prefix web run check"]

[tasks.collect]
run = "go run ./cmd/kbomination collect"

[tasks.e2e]
run = "bash scripts/e2e.sh"

[tasks.testenv]
run = "bash scripts/testenv.sh"

[tasks."sample-db"]
description = "Create a local sample database from checked-in KBOM fixtures"
run = "bash scripts/sample-db.sh"

[tasks."helm:lint"]
description = "Lint the Kubernetes deployment chart"
run = "helm lint chart/kbomination"

[tasks."helm:template"]
description = "Render the Kubernetes deployment chart"
run = "helm template kbomination chart/kbomination"

[tasks."local:deps"]
description = "Check Docker Compose and mkcert for local HTTPS"
run = '''
command -v docker >/dev/null 2>&1 || { echo 'Install and start Docker Desktop or Docker Engine with Compose.'; exit 2; }
docker compose version >/dev/null
command -v mkcert >/dev/null 2>&1 || { echo 'Install mkcert (macOS: brew install mkcert), then retry.'; exit 2; }
'''

[tasks."local:certs"]
description = "Install the local CA and generate trusted HTTPS certificates"
depends = ["local:deps"]
run = '''
mkdir -p local/certs
mkcert -install
if [ ! -f local/certs/kbomination.localhost.pem ] || [ ! -f local/certs/kbomination.localhost-key.pem ]; then
  mkcert -cert-file local/certs/kbomination.localhost.pem -key-file local/certs/kbomination.localhost-key.pem kbomination.localhost localhost 127.0.0.1 ::1
fi
'''

[tasks."local:up"]
description = "Pull and start kbomination behind local Caddy HTTPS"
depends = ["local:certs"]
run = '''
docker compose -f local/compose.yaml up --pull always -d --wait
printf 'Web UI: https://kbomination.localhost:%s\n' "${KBOMINATION_HTTPS_PORT:-8443}"
'''

[tasks."local:down"]
description = "Stop the local HTTPS stack and retain its database"
run = "docker compose -f local/compose.yaml down"

[tasks."local:logs"]
description = "Follow local HTTPS stack logs"
run = "docker compose -f local/compose.yaml logs -f"

[tasks."local:ps"]
description = "Show local HTTPS stack status"
run = "docker compose -f local/compose.yaml ps"

[tasks."local:pull"]
description = "Pull the published kbomination image from GHCR"
run = "docker compose -f local/compose.yaml pull kbomination"

[tasks."local:contexts"]
description = "List kubeconfig contexts from the local HTTPS stack"
run = "docker compose -f local/compose.yaml exec kbomination kbomination contexts"
