[tools]
go = "1.26.8"
node = "24.8.0"
trivy = "0.76.0"
kind = "0.30.0"
kubectl = "1.34.1"

[tasks.setup]
run = ["go mod download", "npm --prefix web ci"]

[tasks.dev]
run = "go run ./cmd/kbomination serve"

[tasks."dev:web"]
run = "npm --prefix web run dev"

[tasks."build:web"]
run = "npm --prefix web run build"

[tasks.build]
depends = ["build:web"]
run = "go build -trimpath -o bin/kbomination ./cmd/kbomination"

[tasks.test]
run = ["go test ./...", "npm --prefix web run check"]

[tasks.collect]
run = "go run ./cmd/kbomination collect"

[tasks.e2e]
run = "bash scripts/e2e.sh"

[tasks.testenv]
run = "bash scripts/testenv.sh"
